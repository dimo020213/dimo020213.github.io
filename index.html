<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سارة القحطاني | محاسبة قانونية</title>
<meta name="description" content="سارة القحطاني، محاسبة قانونية تساعد الشركات الصغيرة على ضبط تكاليفها.">
<meta property="og:title" content="سارة القحطاني | محاسبة قانونية">
<meta property="og:description" content="أساعد الشركات الصغيرة على ضبط تكاليفها.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F7F8FA; --ink:#1E2A38; --muted:#5B6878; --accent:#1F6F8B; --line:#E2E6EB; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Cairo", Tahoma, sans-serif; background:var(--bg); color:var(--ink); line-height:1.8; }
  main { min-height:100vh; display:grid; place-items:center; padding:32px 20px; }
  .card { width:100%; max-width:560px; background:#fff; border:1px solid var(--line); border-radius:20px; padding:40px 28px; text-align:center; }
  .badge { width:84px; height:84px; margin:0 auto 18px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-size:34px; font-weight:800; }
  h1 { margin:0; font-size:30px; font-weight:800; }
  .title { margin:4px 0 0; color:var(--accent); font-weight:600; font-size:18px; }
  .tag { margin:18px 0 26px; color:var(--muted); font-size:17px; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:10px 26px; border-radius:999px; font-weight:600; }
  footer { margin-top:28px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <section class="card">
    <div class="badge" aria-hidden="true">س</div>
    <h1>سارة القحطاني</h1>
    <p class="title">محاسبة قانونية</p>
    <p class="tag">أساعد الشركات الصغيرة على ضبط تكاليفها.</p>
    <a class="btn" href="https://www.linkedin.com/" target="_blank" rel="noopener">تواصل معي على لينكدإن</a>
    <footer>مثال توضيحي من دليل «موقعك المهني بنفسك»</footer>
  </section>
</main>
</body>
</html>
